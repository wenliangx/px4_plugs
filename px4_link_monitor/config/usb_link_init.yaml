# PX4 USB MAVLink link initialization profile.
#
# QGroundControl does not normally persistently write PX4 link parameters when
# connecting. For PX4, its current stream helper restores MAV_CMD_SET_MESSAGE_INTERVAL
# back to the vehicle default by sending interval_us=0 for messages it may
# temporarily raise during tuning views.
#
# This profile follows that QGC "restore defaults" behavior. It does not write
# PX4 parameters and does not request legacy data streams by default.

params_enabled: false
params: {}

# QGC-compatible legacy initial request:
# MAV_CMD_REQUEST_AUTOPILOT_CAPABILITIES (520), param1=1 requests capability/version.
commands:
  REQUEST_AUTOPILOT_CAPABILITIES: 1

# Values:
#   DEFAULT  -> MAV_CMD_SET_MESSAGE_INTERVAL param2 = 0, restore vehicle default
#   DISABLE  -> param2 = -1, disable message where supported
#   number   -> Hz, converted to interval_us
message_intervals:
  ATTITUDE_QUATERNION: DEFAULT
  ATTITUDE_TARGET: DEFAULT
  LOCAL_POSITION_NED: DEFAULT
  POSITION_TARGET_LOCAL_NED: DEFAULT
  NAV_CONTROLLER_OUTPUT: DEFAULT
  VFR_HUD: DEFAULT

# QGC PX4 connection flow does not set old REQUEST_DATA_STREAM rates by default.
streams: {}
